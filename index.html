<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Habit Tracker — Month & Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
 <link rel="apple-touch-icon" href="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=180">
<link rel="icon" type="image/png" href="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=180">

  <style>
    :root {
      --bg-cream: #FDFBF7;
      --text-main: #34302D;
      --text-muted: #8C847C;
      --line-color: rgba(0,0,0,0.08);

      --independent-accent: #BFAF80;
      --morning-bg: #FDF4F2; --morning-accent: #D98A80;
      --day-bg: #F2F5F0; --day-accent: #7A9A80;
      --night-bg: #F0F3F7; --night-accent: #687E96;

      --card-shadow: 0 6px 20px rgba(60, 50, 40, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px 12px 100px 12px;
      min-height: 100vh;
    }

    .planner-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .planner-header { text-align: center; padding: 5px 0; }
    .planner-title { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 600; }

    /* Навигация по месяцам и переключатель вида */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #FFFFFF;
      padding: 14px 18px;
      border-radius: 18px;
      box-shadow: var(--card-shadow);
    }

    .month-navigation {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-main);
      padding: 4px 10px; border-radius: 8px; transition: background 0.2s;
    }
    .nav-btn:hover { background: var(--bg-cream); }

    .current-month-display {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
    }

    .view-toggle {
      display: flex;
      background: var(--bg-cream);
      padding: 4px;
      border-radius: 12px;
    }

    .toggle-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 9px;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: #FFFFFF;
      color: var(--text-main);
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* Общий прогресс */
    .overall-progress {
      background: #FFFFFF; border-radius: 16px; padding: 12px 18px;
      box-shadow: var(--card-shadow); display: flex; align-items: center; justify-content: space-between;
    }
    .progress-text { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-style: italic; }
    .progress-stats {
      font-size: 12px; font-weight: 600; color: var(--day-accent); background: var(--day-bg);
      padding: 4px 12px; border-radius: 20px;
    }

    /* Карточки */
    .section-card {
      background: #FFFFFF; border-radius: 20px; padding: 18px 16px;
      box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 14px;
    }

    .section-card.morning { background-color: var(--morning-bg); }
    .section-card.day { background-color: var(--day-bg); }
    .section-card.night { background-color: var(--night-bg); }

    .card-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      border-bottom: 1px solid var(--line-color); padding-bottom: 8px;
    }

    .card-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; }
    .independent .card-title { color: var(--independent-accent); }
    .morning .card-title { color: var(--morning-accent); }
    .day .card-title { color: var(--day-accent); }
    .night .card-title { color: var(--night-accent); }

    .week-days-labels { display: flex; gap: 8px; }
    .day-label { width: 20px; text-align: center; font-size: 9px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }

    /* Строки в недельном виде */
    .habit-row-week { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
    .habit-name { font-size: 13px; color: var(--text-main); font-weight: 400; flex: 1; padding-right: 8px; }
    .tracker-circles { display: flex; gap: 8px; }

    .circle {
      width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.12);
      background: #FFFFFF; cursor: pointer; transition: all 0.15s ease;
      display: flex; align-items: center; justify-content: center; user-select: none;
    }
    .circle:hover { transform: scale(1.1); }
    .circle.checked::after { content: '✓'; color: #FFFFFF; font-size: 10px; font-weight: bold; }

    .independent .circle.checked { background: var(--independent-accent); border-color: var(--independent-accent); }
    .morning .circle.checked { background: var(--morning-accent); border-color: var(--morning-accent); }
    .day .circle.checked { background: var(--day-accent); border-color: var(--day-accent); }
    .night .circle.checked { background: var(--night-accent); border-color: var(--night-accent); }

    /* СЕТКА МЕСЯЦА И СТАТИСТИКА */
    .habit-block-month {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--line-color);
    }
    .habit-block-month:last-child { border-bottom: none; }

    .month-stats-summary {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .stat-badge {
      background: rgba(0,0,0,0.04);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 4px;
    }

    .month-day-cell {
      aspect-ratio: 1;
      border-radius: 8px;
      background: #FFFFFF;
      border: 1px solid rgba(0,0,0,0.08);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .independent .month-day-cell.checked { background: var(--independent-accent); color: #FFF; border-color: var(--independent-accent); }
    .morning .month-day-cell.checked { background: var(--morning-accent); color: #FFF; border-color: var(--morning-accent); }
    .day .month-day-cell.checked { background: var(--day-accent); color: #FFF; border-color: var(--day-accent); }
    .night .month-day-cell.checked { background: var(--night-accent); color: #FFF; border-color: var(--night-accent); }

    /* Форма добавления */
    .add-habit-card {
      background: #FFFFFF; border-radius: 20px; padding: 16px;
      box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 10px;
    }
    .add-habit-title { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; }
    .add-input-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .add-input {
      flex: 1; padding: 9px 12px; border: 1px solid var(--line-color);
      border-radius: 10px; font-family: 'Montserrat', sans-serif; font-size: 12px; outline: none; background: #FDFBF7; min-width: 130px;
    }
    .add-select {
      padding: 9px; border: 1px solid var(--line-color); border-radius: 10px;
      font-family: 'Montserrat', sans-serif; font-size: 11px; background: #FDFBF7; outline: none;
    }
    .add-btn {
      padding: 9px 14px; background: var(--text-main); color: #FFFFFF;
      border: none; border-radius: 10px; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 500; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="planner-container">
    
    <div class="planner-header">
      <h1 class="planner-title">Daily Habits</h1>
    </div>

    <!-- Панель управления (Месяц + Переключатель) -->
    <div class="controls-panel">
      <div class="month-navigation">
        <button class="nav-btn" onclick="changeMonth(-1)">←</button>
        <span class="current-month-display" id="monthDisplay">Август 2026</span>
        <button class="nav-btn" onclick="changeMonth(1)">→</button>
      </div>
      <div class="view-toggle">
        <button class="toggle-btn active" id="btnWeekView" onclick="setView('week')">Неделя</button>
        <button class="toggle-btn" id="btnMonthView" onclick="setView('month')">Календарь месяца 📅</button>
      </div>
    </div>

    <!-- Виджет общей статистики -->
    <div class="overall-progress">
      <span class="progress-text" id="progressLabel">Прогресс периода</span>
      <span class="progress-stats" id="progressStats">0% выполнено</span>
    </div>

    <!-- Контейнеры для привычек -->
    <div id="independentSection"></div>
    <div id="timeSections"></div>

    <!-- Форма добавления -->
    <div class="add-habit-card">
      <div class="add-habit-title">Добавить новую привычку</div>
      <div class="add-input-group">
        <input type="text" id="newHabitName" class="add-input" placeholder="Название..." />
        <select id="newHabitTime" class="add-select">
          <option value="independent">Просто в течение дня ✨</option>
          <option value="morning">Утро 🌸</option>
          <option value="day">День 🌿</option>
          <option value="night">Вечер 🌙</option>
        </select>
        <button class="add-btn" onclick="addHabit()">+</button>
      </div>
    </div>

  </div>

  <script>
    // Текущие параметры состояния
    let currentView = 'week'; // 'week' или 'month'
    let currentDate = new Date(); // Текущая дата
    
    const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
    const timeTitles = { independent: 'Привычки дня', morning: 'Утренний ритуал', day: 'Дневной фокус', night: 'Вечерний уход' };

    // Начальные данные
    const initialData = [
      { id: 1, name: "Пройти 10 000 шагов", time: "independent", history: {} },
      { id: 2, name: "Выпить 2л воды", time: "independent", history: {} },
      { id: 3, name: "Позвонить близким", time: "independent", history: {} },
      { id: 4, name: "Медитация и дыхание", time: "morning", history: {} },
      { id: 5, name: "Чтение книги", time: "night", history: {} }
    ];

    let habits = JSON.parse(localStorage.getItem('my_aesthetic_habits_v5')) || initialData;

    function saveData() {
      localStorage.setItem('my_aesthetic_habits_v5', JSON.stringify(habits));
      updateProgress();
    }

    // Ключ для даты в формате YYYY-MM-DD
    function formatDateKey(year, month, day) {
      const m = String(month + 1).padStart(2, '0');
      const d = String(day).padStart(2, '0');
      return `${year}-${m}-${d}`;
    }

    function toggleDate(habitId, dateKey) {
      const habit = habits.find(h => h.id === habitId);
      if (habit) {
        if (!habit.history) habit.history = {};
        habit.history[dateKey] = !habit.history[dateKey];
        saveData();
        render();
      }
    }

    function setView(view) {
      currentView = view;
      document.getElementById('btnWeekView').classList.toggle('active', view === 'week');
      document.getElementById('btnMonthView').classList.toggle('active', view === 'month');
      render();
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      render();
    }

    function addHabit() {
      const nameInput = document.getElementById('newHabitName');
      const timeSelect = document.getElementById('newHabitTime');
      const name = nameInput.value.trim();
      if (name === '') return;

      habits.push({ id: Date.now(), name: name, time: timeSelect.value, history: {} });
      saveData();
      nameInput.value = '';
      render();
    }

    // Расчет текущей недели (ПН-ВС)
    function getWeekDates() {
      const curr = new Date(currentDate);
      const day = curr.getDay();
      const diff = curr.getDate() - day + (day === 0 ? -6 : 1); // Коррекция для ПН
      const monday = new Date(curr.setDate(diff));

      const week = [];
      for (let i = 0; i < 7; i++) {
        const nextDay = new Date(monday);
        nextDay.setDate(monday.getDate() + i);
        week.push(nextDay);
      }
      return week;
    }

    // Расчет серии (Streak)
    function calculateStreak(habit) {
      let streak = 0;
      let checkDate = new Date();
      
      while (true) {
        const key = formatDateKey(checkDate.getFullYear(), checkDate.getMonth(), checkDate.getDate());
        if (habit.history && habit.history[key]) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          // Проверяем, может сегодня еще не отмечали, но вчера отмечали
          if (streak === 0) {
            checkDate.setDate(checkDate.getDate() - 1);
            const yesterdayKey = formatDateKey(checkDate.getFullYear(), checkDate.getMonth(), checkDate.getDate());
            if (habit.history && habit.history[yesterdayKey]) {
              continue;
            }
          }
          break;
        }
      }
      return streak;
    }

    function updateProgress() {
      let total = 0, checked = 0;
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      if (currentView === 'week') {
        const weekDates = getWeekDates();
        habits.forEach(h => {
          weekDates.forEach(d => {
            total++;
            const key = formatDateKey(d.getFullYear(), d.getMonth(), d.getDate());
            if (h.history && h.history[key]) checked++;
          });
        });
      } else {
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        habits.forEach(h => {
          for (let d = 1; d <= daysInMonth; d++) {
            total++;
            const key = formatDateKey(year, month, d);
            if (h.history && h.history[key]) checked++;
          }
        });
      }

      const percent = total > 0 ? Math.round((checked / total) * 100) : 0;
      document.getElementById('progressStats').innerText = `🌸 ${percent}% выполнено`;
    }

    function render() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('monthDisplay').innerText = `${monthNames[month]} ${year}`;

      const indContainer = document.getElementById('independentSection');
      const timeContainer = document.getElementById('timeSections');
      indContainer.innerHTML = '';
      timeContainer.innerHTML = '';

      const categories = ['independent', 'morning', 'day', 'night'];

      categories.forEach(cat => {
        const catHabits = habits.filter(h => h.time === cat);
        if (catHabits.length === 0) return;

        const card = document.createElement('div');
        card.className = `section-card ${cat}`;

        if (currentView === 'week') {
          // --- ВЕДЕНИЕ В НЕДЕЛЬНОМ ВИДЕ ---
          const weekDates = getWeekDates();
          let html = `
            <div class="card-header">
              <span class="card-title">${timeTitles[cat]}</span>
              <div class="week-days-labels">
                <span class="day-label">пн</span><span class="day-label">вт</span><span class="day-label">ср</span>
                <span class="day-label">чт</span><span class="day-label">пт</span><span class="day-label">сб</span>
                <span class="day-label">вс</span>
              </div>
            </div>
          `;

          catHabits.forEach(h => {
            let circlesHtml = '';
            weekDates.forEach(d => {
              const key = formatDateKey(d.getFullYear(), d.getMonth(), d.getDate());
              const isChecked = h.history && h.history[key];
              circlesHtml += `<div class="circle ${isChecked ? 'checked' : ''}" onclick="toggleDate(${h.id}, '${key}')"></div>`;
            });
            html += `<div class="habit-row-week"><span class="habit-name">${h.name}</span><div class="tracker-circles">${circlesHtml}</div></div>`;
          });
          card.innerHTML = html;

        } else {
          // --- ВЕДЕНИЕ В МЕСЯЧНОМ ВИДЕ (КАЛЕНДАРЬ + СТАТИСТИКА) ---
          let html = `<div class="card-header"><span class="card-title">${timeTitles[cat]}</span></div>`;

          const daysInMonth = new Date(year, month + 1, 0).getDate();

          catHabits.forEach(h => {
            let doneDays = 0;
            let monthGridHtml = '';

            for (let d = 1; d <= daysInMonth; d++) {
              const key = formatDateKey(year, month, d);
              const isChecked = h.history && h.history[key];
              if (isChecked) doneDays++;
              monthGridHtml += `<div class="month-day-cell ${isChecked ? 'checked' : ''}" onclick="toggleDate(${h.id}, '${key}')">${d}</div>`;
            }

            const monthPercent = Math.round((doneDays / daysInMonth) * 100);
            const streak = calculateStreak(h);

            html += `
              <div class="habit-block-month">
                <span class="habit-name"><strong>${h.name}</strong></span>
                <div class="month-stats-summary">
                  <span class="stat-badge">Итог: ${doneDays}/${daysInMonth} дн. (${monthPercent}%)</span>
                  <span class="stat-badge">Серия: 🔥 ${streak} дн.</span>
                </div>
                <div class="month-grid">${monthGridHtml}</div>
              </div>
            `;
          });
          card.innerHTML = html;
        }

        if (cat === 'independent') indContainer.appendChild(card);
        else timeContainer.appendChild(card);
      });

      updateProgress();
    }

    render();
  </script>
</body>
</html>
